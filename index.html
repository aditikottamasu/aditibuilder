<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f3e8" />
    <title>Aditi's Flower Garden</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

      :root {
        --ink: #294536;
        --leaf: #69956b;
        --cream: #fffdf7;
        --rose: #ee8f9c;
        --gold: #f4c764;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 15%, #fffdf7 0 8%, transparent 8.2%),
          radial-gradient(circle at 90% 18%, #f9dcc8 0 12%, transparent 12.2%),
          linear-gradient(135deg, #f7edda 0%, #f9f4e7 48%, #dbe9d7 100%);
        font-family: "DM Sans", system-ui, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
        position: relative;
        isolation: isolate;
      }

      .card {
        width: min(680px, 100%);
        padding: clamp(2.2rem, 7vw, 4.5rem) clamp(1.6rem, 7vw, 5.5rem);
        position: relative;
        z-index: 1;
        text-align: center;
        background: rgba(255, 253, 247, .76);
        border: 1px solid rgba(255, 255, 255, .95);
        border-radius: 2rem;
        box-shadow: 0 22px 55px rgba(63, 89, 57, .16);
        backdrop-filter: blur(8px);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #7b9a6c;
        font-size: .73rem;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0 auto;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(3.2rem, 10vw, 6.3rem);
        font-weight: 600;
        letter-spacing: -.065em;
        line-height: .9;
      }

      h1 em { color: #d86d80; font-style: italic; }

      .message {
        max-width: 33rem;
        margin: 1.7rem auto 0;
        color: #526658;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.65;
      }

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .75rem;
        margin-top: 2.2rem;
        color: #d86d80;
        font-size: 1.1rem;
      }
      .divider::before, .divider::after {
        width: 3.4rem;
        height: 1px;
        background: #c8d9c5;
        content: "";
      }

      .flower {
        position: absolute;
        width: var(--size);
        aspect-ratio: 1;
        transform: rotate(var(--rotation));
        transform-origin: 50% 75%;
        animation: flower-sway var(--duration) ease-in-out infinite alternate;
        filter: drop-shadow(0 9px 7px rgba(65, 94, 64, .12));
      }
      .flower::before, .flower::after, .flower span::before, .flower span::after {
        position: absolute;
        width: 52%;
        height: 52%;
        border-radius: 58% 42% 58% 42%;
        background: var(--petal);
        content: "";
      }
      .flower::before { top: 0; left: 24%; }
      .flower::after { top: 24%; right: 0; transform: rotate(90deg); }
      .flower span::before { bottom: 0; left: 24%; transform: rotate(180deg); }
      .flower span::after { top: 24%; left: 0; transform: rotate(270deg); }
      .flower i {
        position: absolute;
        top: 37%; left: 37%;
        z-index: 1;
        width: 27%; height: 27%;
        border-radius: 50%;
        background: var(--center, var(--gold));
      }

      .f1 { --size: 155px; --petal: #eea0ad; --rotation: -15deg; --duration: 3.6s; top: -44px; left: 4%; }
      .f2 { --size: 100px; --petal: #f7c75e; --center: #bd7843; --rotation: 28deg; --duration: 4.3s; top: 18%; right: 8%; }
      .f3 { --size: 176px; --petal: #b9d6b0; --center: #6f9969; --rotation: 35deg; --duration: 3.9s; bottom: -57px; right: 5%; }
      .f4 { --size: 82px; --petal: #caa7d2; --center: #efca63; --rotation: -22deg; --duration: 4.8s; bottom: 18%; left: 9%; }

      .sprig {
        position: absolute;
        width: 160px;
        height: 260px;
        opacity: .85;
        transform-origin: bottom center;
        animation: sprig-sway 5.4s ease-in-out infinite alternate;
      }
      .sprig::before {
        position: absolute; bottom: 0; left: 50%; width: 3px; height: 100%;
        border-radius: 3px; background: #71966b; content: ""; transform: rotate(-29deg);
      }
      .sprig span, .sprig span::before, .sprig span::after {
        position: absolute; width: 50px; height: 22px; border-radius: 100% 0 100% 0;
        background: #91b487; content: "";
      }
      .sprig span { bottom: 54px; left: 38px; transform: rotate(26deg); }
      .sprig span::before { bottom: 55px; left: 45px; transform: rotate(-43deg); }
      .sprig span::after { bottom: 108px; left: 27px; transform: rotate(31deg); }
      .left-sprig { --sprig-rotation: 12deg; bottom: -120px; left: -26px; }
      .right-sprig { --sprig-rotation: 182deg; top: -118px; right: -38px; animation-delay: -2.6s; }

      .bug {
        position: absolute;
        z-index: 2;
        filter: drop-shadow(0 4px 3px rgba(63, 89, 57, .13));
        transform-origin: center;
        animation: bug-drift var(--bug-duration, 6s) ease-in-out infinite alternate;
      }

      .ladybug {
        width: 31px;
        height: 27px;
        color: #3d342d;
      }
      .ladybug::before {
        position: absolute;
        top: 7px;
        left: 8px;
        width: 19px;
        height: 16px;
        border: 2px solid currentColor;
        border-radius: 58% 52% 54% 48%;
        background:
          radial-gradient(circle at 31% 32%, currentColor 0 1.7px, transparent 1.9px),
          radial-gradient(circle at 70% 72%, currentColor 0 1.8px, transparent 2px),
          radial-gradient(circle at 70% 27%, currentColor 0 1.5px, transparent 1.7px),
          var(--ladybug-body, #ee6873);
        box-shadow: inset 2px 0 0 rgba(255, 255, 255, .26);
        content: "";
      }
      .ladybug::after {
        position: absolute;
        top: 8px;
        left: 4px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }
      .ladybug span, .ladybug span::after {
        position: absolute;
        top: 1px;
        left: 5px;
        width: 6px;
        height: 9px;
        border-left: 1.5px solid currentColor;
        border-radius: 70% 0 0 0;
        content: "";
        transform-origin: 100% 100%;
        animation: antennae 1.5s ease-in-out infinite alternate;
      }
      .ladybug span::after {
        top: 0;
        left: 2px;
        border: 0;
        border-right: 1.5px solid currentColor;
        border-radius: 0 70% 0 0;
        animation-delay: -.55s;
      }

      .caterpillar {
        width: 48px;
        height: 24px;
        color: #42694d;
      }
      .caterpillar::before {
        position: absolute;
        bottom: 4px;
        left: 7px;
        width: 13px;
        height: 13px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        background: #99c779;
        box-shadow:
          10px -3px 0 -1px #b5d987, 10px -3px 0 .5px currentColor,
          21px -5px 0 -1px #a7d17d, 21px -5px 0 .5px currentColor,
          32px -4px 0 -1px #8fc46e, 32px -4px 0 .5px currentColor;
        content: "";
      }
      .caterpillar::after {
        position: absolute;
        top: 4px;
        right: 1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: -1px 2px 0 -1px #fffdf7;
        content: "";
      }
      .caterpillar span, .caterpillar span::after {
        position: absolute;
        top: -3px;
        right: 6px;
        width: 6px;
        height: 9px;
        border-right: 1.5px solid currentColor;
        border-radius: 0 70% 0 0;
        content: "";
        transform-origin: 0 100%;
        animation: antennae 1.5s ease-in-out infinite alternate;
      }
      .caterpillar span::after {
        top: 0;
        right: auto;
        left: 3px;
        border: 0;
        border-left: 1.5px solid currentColor;
        border-radius: 70% 0 0 0;
        animation-delay: -.55s;
      }

      .bug-one { --ladybug-body: #ef6e76; --bug-duration: 5.7s; top: 13%; left: 18%; }
      .bug-two { --bug-duration: 6.4s; bottom: 15%; right: 19%; animation-delay: -2.8s; }
      .bug-three { --ladybug-body: #ef9a61; --bug-duration: 5.2s; top: 31%; right: 18%; animation-delay: -1.4s; }

      @keyframes flower-sway {
        from { transform: rotate(calc(var(--rotation) - 3deg)) translateY(2px); }
        to { transform: rotate(calc(var(--rotation) + 5deg)) translateY(-5px); }
      }
      @keyframes sprig-sway {
        from { transform: rotate(calc(var(--sprig-rotation) - 3deg)); }
        to { transform: rotate(calc(var(--sprig-rotation) + 3deg)); }
      }
      @keyframes bug-drift {
        from { transform: translate(-4px, 3px) rotate(-5deg); }
        to { transform: translate(6px, -5px) rotate(5deg); }
      }
      @keyframes antennae { to { transform: rotate(16deg); } }
      @media (prefers-reduced-motion: reduce) {
        .flower, .sprig, .bug, .ladybug span, .ladybug span::after, .caterpillar span, .caterpillar span::after { animation: none; }
      }
      @media (max-width: 560px) { .f2 { right: -24px; } .f4 { left: -26px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="sprig left-sprig" aria-hidden="true"><span></span></div>
      <div class="sprig right-sprig" aria-hidden="true"><span></span></div>
      <div class="flower f1" aria-hidden="true"><span></span><i></i></div>
      <div class="flower f2" aria-hidden="true"><span></span><i></i></div>
      <div class="flower f3" aria-hidden="true"><span></span><i></i></div>
      <div class="flower f4" aria-hidden="true"><span></span><i></i></div>
      <div class="bug ladybug bug-one" aria-hidden="true"><span></span></div>
      <div class="bug caterpillar bug-two" aria-hidden="true"><span></span></div>
      <div class="bug ladybug bug-three" aria-hidden="true"><span></span></div>
      <section class="card" aria-labelledby="welcome-title">
        <p class="eyebrow">A little garden, just for you</p>
        <h1 id="welcome-title">Hello, <em>Aditi</em></h1>
        <p class="message">May your day bloom with bright ideas, gentle moments, and a little bit of sunshine.</p>
        <div class="divider" aria-hidden="true">✿</div>
      </section>
    </main>
  </body>
</html>
